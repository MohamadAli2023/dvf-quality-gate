[project]
name = "dvf-gate"
version = "0.1.0"
description = "Automated data quality gate and analytical pipeline for French property transactions (DVF)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pandera>=0.20",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "duckdb>=1.0",
  "numpy>=1.26",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = ["integration: needs a running PostgreSQL"]

[tool.ruff]
line-length = 100
